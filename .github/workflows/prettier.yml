name: Formatar codigo com Prettier

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Prettier
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Executar Prettier
        run: npm run format

      - name: Registrar formatacao (se houver mudancas)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.css' README.md package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar paginas e estilos com Prettier"
            git push
          else
            echo "Arquivos ja formatados"
          fi
