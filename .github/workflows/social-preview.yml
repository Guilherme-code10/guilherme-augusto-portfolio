name: Gerar imagem de compartilhamento

on:
  push:
    branches:
      - main
    paths:
      - scripts/gerar_preview.py
      - .github/workflows/social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar biblioteca de imagem
        run: pip install "Pillow==11.3.0"
      - name: Gerar PNG para WhatsApp
        run: python scripts/gerar_preview.py
      - name: Salvar PNG no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/preview.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: adicionar capa para compartilhamento"
            git push
          fi
